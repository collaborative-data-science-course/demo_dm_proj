[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "dm_classif"
version = "0.0.1"
description = "This is a demo diabetes classification project to predict if a person has diabetes or not based on some of the medical parameters."
authors = [
  { name = "Ricky" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["dm_classif"]
include = ["pyproject.toml", "dm_classif/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["dm_classif"]
force-sort-within-sections = true

